<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <g opacity="0.06" fill="white">
    <circle cx="200" cy="100" r="180"/>
    <circle cx="1000" cy="530" r="220"/>
    <circle cx="600" cy="315" r="300"/>
    <circle cx="100" cy="500" r="120"/>
    <circle cx="1100" cy="150" r="140"/>
  </g>

  <!-- Gold accent line -->
  <rect x="400" y="180" width="400" height="3" rx="1.5" fill="url(#gold)" opacity="0.7"/>

  <!-- Arabic title -->
  <text x="600" y="280" text-anchor="middle" font-family="serif" font-size="72" font-weight="bold" fill="white">سحر التحميل</text>

  <!-- English title -->
  <text x="600" y="340" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="white" opacity="0.95">TANZEEL</text>

  <!-- Subtitle -->
  <text x="600" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="white" opacity="0.7">Free Video Downloader &middot; No Ads &middot; HD Quality</text>

  <!-- Platform badges -->
  <g transform="translate(600, 450)">
    <rect x="-280" y="-18" width="110" height="36" rx="18" fill="white" opacity="0.15"/>
    <text x="-225" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">YouTube</text>

    <rect x="-155" y="-18" width="90" height="36" rx="18" fill="white" opacity="0.15"/>
    <text x="-110" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Instagram</text>

    <rect x="-50" y="-18" width="90" height="36" rx="18" fill="white" opacity="0.15"/>
    <text x="-5" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Twitter</text>

    <rect x="55" y="-18" width="90" height="36" rx="18" fill="white" opacity="0.15"/>
    <text x="100" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">TikTok</text>

    <rect x="160" y="-18" width="110" height="36" rx="18" fill="white" opacity="0.15"/>
    <text x="215" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Facebook</text>
  </g>

  <!-- URL -->
  <text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.5">tanzeel.app</text>

  <!-- Brand dots -->
  <circle cx="570" cy="565" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="600" cy="565" r="3" fill="#fbbf24" opacity="0.8"/>
  <circle cx="630" cy="565" r="3" fill="#fbbf24" opacity="0.8"/>
</svg>
